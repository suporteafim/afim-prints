name: AfimPrints
options:
  bundleIdPrefix: app.afim.prints
  deploymentTarget:
    iOS: "17.0"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Host
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
schemes:
  UITests:
    build:
      targets:
        Host: all
        UITests: [test]
    test:
      targets: [UITests]
