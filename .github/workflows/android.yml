name: Android prints
on:
  workflow_dispatch:
  push:
    paths-ignore: ["state.txt"]
env:
  TZ: America/Sao_Paulo
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Baixar APK
        run: curl -L -o afim.apk "https://huggingface.co/afimguairasp/afim/resolve/main/AfimGuairaSP.apk?download=true" && ls -la afim.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            bash scripts/android_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-prints
          path: shots
