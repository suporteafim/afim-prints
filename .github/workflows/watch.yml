name: Vigia atualizacoes
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ver se o APK ou o site mudaram
        id: chk
        run: |
          APK=$(curl -s https://huggingface.co/api/models/afimguairasp/afim | python3 -c "import json,sys;print(json.load(sys.stdin)['sha'])")
          WEB=$(curl -sL https://afim.expo.app | sha256sum | cut -c1-16)
          NEW="apk=$APK web=$WEB"; OLD=$(cat state.txt 2>/dev/null || echo none)
          echo "antes: $OLD"; echo "agora: $NEW"
          if [ "$NEW" != "$OLD" ]; then echo "$NEW" > state.txt; echo "changed=yes" >> $GITHUB_OUTPUT; fi
      - name: Salvar estado e disparar testes
        if: steps.chk.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "afim-bot"; git config user.email "suporteafim@gmail.com"
          git add state.txt; git commit -m "Atualizacao detectada [skip ci]"; git push
          gh workflow run android.yml; gh workflow run ios.yml
